<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030306">
  <title>Coração de partículas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at center, #100308 0%, #050307 48%, #000 100%);
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui {
      position: fixed; inset: auto 0 0; display: flex; justify-content: center;
      padding: 18px 14px max(18px, env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .hint {
      color: rgba(255,255,255,.58); font-size: 12px; letter-spacing: .04em;
      text-align: center; text-shadow: 0 1px 8px #000;
    }
    .top {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0;
      text-align: center; pointer-events: none;
    }
    .top span {
      font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
      color: rgba(255,190,200,.45);
    }
    button {
      position: fixed; right: 18px; top: max(16px, env(safe-area-inset-top));
      border: 1px solid rgba(255,110,130,.28); background: rgba(25,5,12,.45);
      color: rgba(255,220,225,.8); border-radius: 999px; padding: 9px 13px;
      font: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px);
    }
    button:active { transform: scale(.96); }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Coração vermelho formado por partículas luminosas"></canvas>
  <div class="top"><span>feito de luz</span></div>
  <button id="replay" type="button">Recomeçar</button>
  <div class="ui"><div class="hint">Toque na tela para espalhar e reunir as partículas</div></div>

  <script>
    (() => {
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: true });
      const replay = document.getElementById('replay');

      let w = 0, h = 0, dpr = 1, particles = [], sparks = [];
      let start = performance.now(), last = start, pulse = 0;
      const COUNT = 1150;
      const TAU = Math.PI * 2;
      const rand = (a, b) => a + Math.random() * (b - a);

      function heartPoint(t) {
        // Curva paramétrica clásica del corazón.
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        return { x, y: -y };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makeParticle() {
        const t = Math.random() * TAU;
        const edge = heartPoint(t);
        // Distribuição entre o contorno e o interior do coração.
        const fill = Math.sqrt(Math.random());
        const scale = Math.min(w * 0.022, h * 0.020, 12.5);
        const targetX = edge.x * fill * scale;
        const targetY = edge.y * fill * scale;
        const cx = w / 2, cy = h / 2 + h * 0.015;
        return {
          x: cx + rand(-w*.45, w*.45), y: cy + rand(-h*.4, h*.4),
          tx: targetX, ty: targetY, vx: rand(-.3,.3), vy: rand(-.3,.3),
          size: rand(.45, 1.7), alpha: rand(.25,.95),
          hue: rand(350, 365), phase: rand(0, TAU),
          speed: rand(.012,.045), trail: []
        };
      }

      function reset() {
        particles = Array.from({ length: COUNT }, makeParticle);
        sparks = [];
        start = performance.now();
      }

      function burst(x, y) {
        for (let i = 0; i < 95; i++) {
          const a = rand(0, TAU), s = rand(1.2, 5.8);
          sparks.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                        life: rand(35, 85), max: 85, size: rand(.7, 2.2) });
        }
        // Impulso suave nas partículas próximas ao toque.
        for (const p of particles) {
          const dx = w/2 + p.tx - x, dy = h/2 + h*.015 + p.ty - y;
          const dist = Math.hypot(dx, dy);
          if (dist < 145) {
            const force = (1 - dist/145) * 8;
            p.vx -= dx/(dist || 1)*force;
            p.vy -= dy/(dist || 1)*force;
          }
        }
      }

      function draw(now) {
        const dt = Math.min((now - last) / 16.67, 2);
        last = now;
        const elapsed = (now - start) / 1000;
        pulse = 1 + Math.sin(elapsed * 2.2) * .035 + Math.sin(elapsed * 4.4) * .012;

        // Persistência do quadro anterior cria rastros luminosos.
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(0,0,0,0.19)';
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'lighter';

        const cx = w/2, cy = h/2 + h*.015;
        const scale = Math.min(w * 0.022, h * 0.020, 12.5) * pulse;

        // Névoa vermelha difusa atrás do coração.
        const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.min(w,h)*.24);
        glow.addColorStop(0, 'rgba(255,0,38,0.105)');
        glow.addColorStop(.45, 'rgba(130,0,24,0.035)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        for (const p of particles) {
          const tx = cx + p.tx * pulse;
          const ty = cy + p.ty * pulse;
          const dx = tx - p.x, dy = ty - p.y;
          p.vx += dx * .006 * dt;
          p.vy += dy * .006 * dt;
          p.vx *= Math.pow(.91, dt);
          p.vy *= Math.pow(.91, dt);
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          const twinkle = .55 + .45 * Math.sin(now * p.speed + p.phase);
          const a = p.alpha * twinkle;
          const r = p.size * (0.8 + twinkle*.55);

          // Pequenos riscos aleatórios dão o aspecto de filamentos.
          if (Math.random() < .018) {
            ctx.strokeStyle = `rgba(255,35,65,${a*.34})`;
            ctx.lineWidth = .55;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx*rand(2,8), p.y - p.vy*rand(2,8));
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue},100%,${rand(48,68)}%,${a})`;
          ctx.shadowBlur = 7 + r*5;
          ctx.shadowColor = 'rgba(255,0,40,.95)';
          ctx.arc(p.x, p.y, r, 0, TAU);
          ctx.fill();
        }

        // Contorno sutil de pontos para definir a silhueta.
        ctx.shadowBlur = 13;
        ctx.shadowColor = 'rgba(255,0,35,.8)';
        ctx.strokeStyle = 'rgba(255,25,55,.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= 220; i++) {
          const q = heartPoint(i/220*TAU);
          const x = cx + q.x*scale, y = cy + q.y*scale;
          if (!i) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();

        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.x += s.vx*dt; s.y += s.vy*dt;
          s.vx *= .98; s.vy *= .98; s.life -= dt;
          if (s.life <= 0) { sparks.splice(i,1); continue; }
          ctx.globalAlpha = Math.max(0, s.life/s.max);
          ctx.fillStyle = '#ff244b';
          ctx.shadowBlur = 12; ctx.shadowColor = '#ff002e';
          ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,TAU); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(draw);
      }

      canvas.addEventListener('pointerdown', e => burst(e.clientX, e.clientY));
      replay.addEventListener('click', reset);
      window.addEventListener('resize', () => { resize(); reset(); });
      resize();
      reset();
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,w,h);
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
